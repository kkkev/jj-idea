name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: false
        type: choice
        options:
          - '' # snapshot build (default)
          - patch
          - minor
          - major
      skip_ci_check:
        description: 'Release even if the commit has no green push CI run (release runs do not repeat compat/verify)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read   # release runs look up the commit's push-triggered CI run

jobs:
  changelog-check:
    # Check that changelog is updated when source code changes
    # Skip for: tags, workflow_dispatch releases, [skip changelog] in commit message, or no source changes
    if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.bump == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for skip changelog flag
        id: skip-check
        run: |
          # Check commit message for [skip changelog]
          if git log --format=%B -n 1 ${{ github.sha }} | grep -qi '\[skip changelog\]'; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping changelog check: [skip changelog] found in commit message"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Check changelog updated
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          # Get the base ref for comparison
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_SHA=${{ github.event.pull_request.base.sha }}
          else
            BASE_SHA=${{ github.event.before }}
          fi

          # Check if source code changed
          SOURCE_CHANGED=$(git diff --name-only $BASE_SHA ${{ github.sha }} -- 'src/main/**' | head -1)

          if [ -n "$SOURCE_CHANGED" ]; then
            echo "Source code changed, checking changelog..."

            # Check if CHANGELOG.md or the preview-changelog holding file was updated
            CHANGELOG_CHANGED=$(git diff --name-only $BASE_SHA ${{ github.sha }} -- 'CHANGELOG.md' 'docs/preview-changelog.md' | head -1)

            if [ -z "$CHANGELOG_CHANGED" ]; then
              echo "::error::Source code changed but CHANGELOG.md was not updated."
              echo "::error::Please add an entry to the [Unreleased] section of CHANGELOG.md"
              echo "::error::(or, for a preview-gated feature, to docs/preview-changelog.md)."
              echo "::error::If this change doesn't need a changelog entry (refactoring, tests, etc.),"
              echo "::error::add [skip changelog] to your commit message."
              exit 1
            else
              echo "Changelog was updated. Check passed."
            fi
          else
            echo "No source code changes detected. Skipping changelog check."
          fi

  # Cross-version compatibility gate: compiles, unit-tests, and platform-tests against
  # the full supported platform range — the sinceBuild=251 floor (2025.1), the previous
  # release (2025.2), and the newest supported platform (2026.2, build 262) — separately
  # from the release `build` job (which only builds/publishes on the default
  # platformVersion). Platform
  # releases have broken plugin-visible behavior without any binary-incompatible signature
  # change (jj-idea-qfgl / GitHub #55), so this only catches compile- and test-time
  # breaks; it does not replace a manual runIde smoke test against a new platform version.
  #
  # Release runs (workflow_dispatch with a bump, or a v* tag) skip this and the checks in `build`:
  # they would repeat what the push of the same commit already ran. The release job instead
  # requires that push run to have succeeded ("Require green CI for this commit").
  compat:
    if: ${{ inputs.bump == '' && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [ '2025.1', '2025.2', '2026.2' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags needed by ChangelogReleaseDriftTest (jj-idea-j8s6)

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile and unit test against ${{ matrix.platform }}
        run: ./gradlew compileKotlin test -PplatformVersion=${{ matrix.platform }}

      # platformTest runs IntelliJ's LeakHunter at global teardown, which is prone to a
      # GC-timing false positive (retained-Project report that doesn't reproduce locally or
      # on a rerun of the same commit). Retry a few times before failing the build.
      - name: Platform tests against ${{ matrix.platform }} (retry flaky LeakHunter leak detection)
        run: |
          for attempt in 1 2 3; do
            echo "platformTest attempt $attempt"
            if ./gradlew platformTest --rerun -PplatformVersion=${{ matrix.platform }}; then exit 0; fi
            echo "::warning::platformTest attempt $attempt failed (likely flaky LeakHunter); retrying"
          done
          exit 1

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.platform }}
          path: build/reports/tests/
          retention-days: 14

  # Builds the plugin once. Non-release runs also lint and run the Plugin Verifier on the same
  # build (previously a separate `verify` job that compiled and built everything again). Release
  # runs skip those (already green on the push) and go on to release and publish.
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.version.outputs.is_release == 'true' && steps.publish_token.outputs.present == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for version calculation

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Calculate version
        id: version
        run: |
          if [[ -n "${{ inputs.bump }}" ]]; then
            # Manual release via workflow_dispatch - calculate next version
            # Get latest version tag
            LATEST_TAG=$(git tag -l 'v*' | sort -V | tail -1)
            if [[ -z "$LATEST_TAG" ]]; then
              LATEST_TAG="v0.0.0"
            fi
            # Parse version components
            LATEST_VERSION=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"

            # Bump based on input
            case "${{ inputs.bump }}" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac

            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            IS_RELEASE=true
            echo "Bumping from ${LATEST_VERSION} to ${VERSION} (${{ inputs.bump }})"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Tagged release: use tag version (e.g., v0.2.0 -> 0.2.0)
            VERSION=${GITHUB_REF#refs/tags/v}
            IS_RELEASE=true
          else
            # Development build: use snapshot version based on latest tag
            LATEST_TAG=$(git tag -l 'v*' | sort -V | tail -1)
            LATEST_VERSION=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
            VERSION="${MAJOR}.${MINOR}.${{ github.run_number }}-SNAPSHOT"
            IS_RELEASE=false
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "is_release=${IS_RELEASE}" >> $GITHUB_OUTPUT
          echo "Calculated version: ${VERSION} (release: ${IS_RELEASE})"

      - name: Require green CI for this commit
        if: steps.version.outputs.is_release == 'true' && !inputs.skip_ci_check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Release runs skip compat/verify. Instead require that this commit's push-triggered run
          # passed (waiting for it if still running). The release bot's own commits never get a
          # push run, so walk back over them.
          SHA=$GITHUB_SHA
          while [ "$(git log -1 --format=%an "$SHA")" = "github-actions[bot]" ]; do
            SHA=$(git rev-parse "$SHA^")
          done
          for attempt in $(seq 1 60); do
            RUN=$(gh run list --workflow build.yml --event push --commit "$SHA" --limit 1 \
              --json status,conclusion,url -q '.[0] // empty | "\(.status) \(.conclusion) \(.url)"')
            if [ -z "$RUN" ]; then
              echo "::error::No push CI run found for ${SHA}. Push it and let CI finish, or re-run with skip_ci_check."
              exit 1
            fi
            read -r STATUS CONCLUSION URL <<< "$RUN"
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "CI for ${SHA} passed: ${URL}"
                exit 0
              fi
              echo "::error::CI for ${SHA} ended '${CONCLUSION}': ${URL}"
              exit 1
            fi
            echo "CI for ${SHA} is ${STATUS} (${URL}); waiting (attempt ${attempt}/60)..."
            sleep 30
          done
          echo "::error::Timed out waiting for CI on ${SHA}."
          exit 1

      - name: Update version in build.gradle.kts
        run: |
          sed -i 's/^version = .*/version = "${{ steps.version.outputs.version }}"/' build.gradle.kts
          cat build.gradle.kts | grep '^version'

      - name: Build plugin
        # jj-idea-0x06: PREVIEW_CODE_KEY signs JJP1 preview access codes (preview/AccessCode.kt).
        # Only injected - and required, via -PrequirePreviewCodeKey - for an actual tagged/dispatched
        # release. Every other run (PRs, snapshot pushes to master) builds with the key ABSENT on
        # purpose: their plugin-artifact.zip is a downloadable Actions artifact on this public repo,
        # and embedding the real key in a snapshot build shipped on every push would leak it far more
        # often than a real release. Non-release builds simply can't validate JJP1 codes, same as any
        # local dev build - only the legacy access-codes.txt path works there. See
        # generatePreviewCodeKey in build.gradle.kts. The Marketplace publish step further down
        # rebuilds the plugin and needs the same key + flag (jj-idea-cxg5).
        run: |
          if [ "${{ steps.version.outputs.is_release }}" = "true" ]; then
            PREVIEW_CODE_KEY="${{ secrets.PREVIEW_CODE_KEY }}" ./gradlew buildPlugin -PrequirePreviewCodeKey
          else
            ./gradlew buildPlugin
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-artifact
          path: build/distributions/*.zip
          retention-days: 30

      - name: Lint
        if: steps.version.outputs.is_release != 'true'
        run: ./gradlew ktlintCheck

      # Plugin Verifier against every IDE in the pluginVerification block (build.gradle.kts),
      # including the sinceBuild floor, then checkVerifierBaseline for internal-API usage.
      # Reuses the plugin built above; IDE downloads come from the Gradle cache.
      - name: Verify plugin
        if: steps.version.outputs.is_release != 'true'
        run: ./gradlew verifyPlugin

      - name: Upload verifier reports
        if: failure() && steps.version.outputs.is_release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier/
          retention-days: 14

      - name: Extract changelog for release
        if: steps.version.outputs.is_release == 'true'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # For workflow_dispatch, use [Unreleased] section since CHANGELOG.md
          # hasn't been updated yet with a versioned section
          if [[ -n "${{ inputs.bump }}" ]]; then
            TARGET_SECTION="Unreleased"
          else
            TARGET_SECTION="$VERSION"
          fi

          # Extract section between ## [TARGET] and next ## [ or link reference
          NOTES=$(awk -v target="$TARGET_SECTION" '
            $0 ~ "^## \\[" target "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[.+\]:/ { exit }
            found { print }
          ' CHANGELOG.md)

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Verify built plugin contains the preview code key
        if: steps.version.outputs.is_release == 'true'
        run: |
          mkdir -p /tmp/built-check
          unzip -oq build/distributions/*.zip -d /tmp/built-check
          for jar in /tmp/built-check/*/lib/jj-idea-*.jar; do
            unzip -l "$jar" | grep -q ' preview/code-key.bin$' && exit 0
          done
          echo "::error::preview/code-key.bin missing from the release build."
          exit 1

      # Create release (from tag push or workflow_dispatch)
      - name: Create GitHub Release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.notes }}
          files: build/distributions/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CHANGELOG.md for workflow_dispatch release
        if: steps.version.outputs.is_release == 'true' && inputs.bump != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DATE=$(date +%Y-%m-%d)

          # Move [Unreleased] content to new version section
          awk -v version="$VERSION" -v date="$DATE" '
            BEGIN { in_unreleased = 0 }

            /^## \[Unreleased\]/ {
              print $0
              print ""
              print "## [" version "] - " date
              in_unreleased = 1
              next
            }

            in_unreleased && /^## \[/ {
              in_unreleased = 0
              print $0
              next
            }

            /^\[Unreleased\]:/ {
              print "[Unreleased]: https://github.com/kkkev/jj-idea/compare/v" version "...HEAD"
              next
            }

            { print }
          ' CHANGELOG.md > CHANGELOG.md.tmp && mv CHANGELOG.md.tmp CHANGELOG.md

          # Add link for new version after [Unreleased]: line
          if ! grep -q "^\[$VERSION\]:" CHANGELOG.md; then
            awk -v version="$VERSION" '
              /^\[Unreleased\]:/ {
                print
                print "[" version "]: https://github.com/kkkev/jj-idea/releases/tag/v" version
                next
              }
              { print }
            ' CHANGELOG.md > CHANGELOG.md.tmp && mv CHANGELOG.md.tmp CHANGELOG.md
          fi

      - name: Update plugin repository XML
        if: steps.version.outputs.is_release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
          CHANGE_NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          PLUGIN_FILE="jj-idea-${VERSION}.zip"

          # Convert markdown to basic HTML (safely via env var)
          CHANGE_NOTES_HTML=$(echo "$CHANGE_NOTES" | sed 's/^### \(.*\)$/<h4>\1<\/h4>/g' | sed 's/^- \(.*\)$/<li>\1<\/li>/g' | sed 's/^$//g')

          cat > updatePlugins.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plugins>
            <plugin id="in.kkkev.jj-idea" url="https://github.com/kkkev/jj-idea/releases/download/${TAG_NAME}/${PLUGIN_FILE}" version="${VERSION}">
              <idea-version since-build="251.0" />
              <name>Jujutsu VCS Integration</name>
              <description><![CDATA[
                <p>Native IntelliJ integration for <a href="https://jj-vcs.github.io/jj/">Jujutsu (jj)</a>, a Git-compatible version control system with a fundamentally different approach to working with code.</p>

                <h3>Why Jujutsu?</h3>
                <p>Jujutsu treats your working copy as a commit—always. No staging area, no "dirty" state. Just describe what you're working on and keep coding.</p>

                <h3>Key Features</h3>
                <ul>
                    <li><b>Describe-First Workflow</b> — Working Copy tool window for describing current work and creating new changes.</li>
                    <li><b>Custom Log View</b> — Visual commit graph with inline change IDs, descriptions, and bookmarks.</li>
                    <li><b>Change Operations</b> — Edit, abandon, and describe changes directly from the log.</li>
                    <li><b>File History &amp; Annotations</b> — Full file history with diff viewer and line-by-line blame.</li>
                    <li><b>Multi-Repository Support</b> — Work with multiple JJ repositories in a single project.</li>
                    <li><b>Real-Time Status</b> — Auto-refresh keeps the UI in sync as you edit files.</li>
                </ul>

                <p><a href="https://github.com/kkkev/jj-idea">GitHub</a> · <a href="https://github.com/kkkev/jj-idea/issues">Issues</a></p>
              ]]></description>
              <vendor email="jj-idea@kkkev.in" url="https://github.com/kkkev/jj-idea">Kevin Thomas</vendor>
              <change-notes><![CDATA[
                <h3>${VERSION}</h3>
                ${CHANGE_NOTES_HTML}
                <p>See <a href="https://github.com/kkkev/jj-idea/releases/tag/${TAG_NAME}">full release notes</a> for details.</p>
              ]]></change-notes>
            </plugin>
          </plugins>
          EOF

      - name: Commit updated plugin repository XML
        if: steps.version.outputs.is_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updatePlugins.xml CHANGELOG.md
          git commit -m "Update plugin repository for release ${{ steps.version.outputs.tag }}" || echo "No changes to commit"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      # Publish to JetBrains Marketplace on releases
      # Requires PUBLISH_TOKEN secret from JetBrains Hub (hub.jetbrains.com → Profile → Tokens)
      # Optional: CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD for plugin signing
      # `env.X` in a step's `if:` only sees job/workflow-level env, never another step's `env:`.
      # The publish token used to be set only on the publish step, so every `env.PUBLISH_TOKEN`
      # condition on the steps below evaluated false and they were silently skipped — which is
      # how the 0.9.2 Marketplace rejection went unnoticed. Expose "is a token configured" as a
      # step output instead, without widening the secret's scope.
      - name: Check Marketplace publish token
        id: publish_token
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          IS_RELEASE: ${{ steps.version.outputs.is_release }}
          IS_UPSTREAM: ${{ github.repository == 'kkkev/jj-idea' }}
        run: |
          if [ -n "$PUBLISH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            # A release that quietly skips Marketplace is the same invisible miss as 0.9.2's
            # skipped approval check. Forks (no Marketplace listing) still release to GitHub only.
            if [ "$IS_RELEASE" = "true" ] && [ "$IS_UPSTREAM" = "true" ]; then
              echo "::error::PUBLISH_TOKEN secret is not set; this release would skip the JetBrains Marketplace publish and its approval check."
              exit 1
            fi
          fi

      - name: Publish to JetBrains Marketplace
        if: steps.version.outputs.is_release == 'true' && steps.publish_token.outputs.present == 'true'
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          # jj-idea-cxg5: publishPlugin re-runs buildPlugin, and generatePreviewCodeKey always
          # re-runs and DELETES preview/code-key.bin when it finds no key. Without the key here
          # (as in 0.8.18/0.8.19) the Marketplace jar shipped without it and every JJP1 code was
          # rejected for Marketplace installs, though the GitHub Release zip was fine.
          PREVIEW_CODE_KEY: ${{ secrets.PREVIEW_CODE_KEY }}
        run: ./gradlew publishPlugin -PrequirePreviewCodeKey

      - name: Verify published plugin still contains the preview code key
        if: steps.version.outputs.is_release == 'true' && steps.publish_token.outputs.present == 'true'
        run: |
          # publishPlugin rebuilt build/distributions/*.zip; check what it actually uploaded.
          mkdir -p /tmp/published-check
          unzip -oq build/distributions/*.zip -d /tmp/published-check
          for jar in /tmp/published-check/*/lib/jj-idea-*.jar; do
            unzip -l "$jar" | grep -q ' preview/code-key.bin$' && exit 0
          done
          echo "::error::preview/code-key.bin missing from the plugin that publishPlugin uploaded - JJP1 codes would be rejected on Marketplace installs."
          exit 1

  # publishPlugin succeeding only means the upload was accepted — Marketplace then runs its own
  # automated compatibility check asynchronously (observed 12–40 min) and can still reject it
  # for reasons our verifyPlugin doesn't check (0.8.11, 0.9.2). Poll the public Marketplace API
  # and fail this job if the just-released version doesn't show up listed+approved. A separate,
  # dependency-free job so the release itself isn't held open by the wait. 30576 is this
  # plugin's numeric Marketplace ID (https://plugins.jetbrains.com/plugin/30576), distinct from
  # its xmlId (in.kkkev.jj-idea).
  marketplace-approval:
    needs: build
    if: ${{ needs.build.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Wait for JetBrains Marketplace approval
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          MAX_ATTEMPTS=70
          SLEEP_SECONDS=60
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Checking Marketplace listing for $VERSION (attempt $attempt/$MAX_ATTEMPTS)..."
            # Response is a bare JSON array of version objects; the approval field is "approve",
            # not "approved". Write to a file rather than a shell variable: the changelog notes
            # embedded in each entry are large HTML blobs that command substitution has mangled.
            if curl -sf "https://plugins.jetbrains.com/api/plugins/30576/updates?page=1&size=5" -o /tmp/marketplace-updates.json; then
              MATCH=$(jq -r --arg v "$VERSION" \
                '.[]? | select(.version == $v and .approve == true and .listed == true) | .version' \
                /tmp/marketplace-updates.json)
              if [[ "$MATCH" == "$VERSION" ]]; then
                echo "$VERSION is listed and approved on JetBrains Marketplace."
                exit 0
              fi
            fi
            sleep "$SLEEP_SECONDS"
          done
          echo "::error::$VERSION was not listed/approved on JetBrains Marketplace after $((MAX_ATTEMPTS * SLEEP_SECONDS / 60)) minutes."
          echo "::error::The upload succeeded but Marketplace's own compatibility check may have rejected it (as with 0.8.11 and 0.9.2)."
          echo "::error::Check https://plugins.jetbrains.com/plugin/30576 and the JetBrains Hub developer dashboard/email for the specific violation."
          exit 1

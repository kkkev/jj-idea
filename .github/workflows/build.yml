name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: false
        type: choice
        options:
          - '' # snapshot build (default)
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  changelog-check:
    # Check that changelog is updated when source code changes
    # Skip for: tags, workflow_dispatch releases, [skip changelog] in commit message, or no source changes
    if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.bump == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for skip changelog flag
        id: skip-check
        run: |
          # Check commit message for [skip changelog]
          if git log --format=%B -n 1 ${{ github.sha }} | grep -qi '\[skip changelog\]'; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping changelog check: [skip changelog] found in commit message"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Check changelog updated
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          # Get the base ref for comparison
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_SHA=${{ github.event.pull_request.base.sha }}
          else
            BASE_SHA=${{ github.event.before }}
          fi

          # Check if source code changed
          SOURCE_CHANGED=$(git diff --name-only $BASE_SHA ${{ github.sha }} -- 'src/main/**' | head -1)

          if [ -n "$SOURCE_CHANGED" ]; then
            echo "Source code changed, checking changelog..."

            # Check if CHANGELOG.md or the preview-changelog holding file was updated
            CHANGELOG_CHANGED=$(git diff --name-only $BASE_SHA ${{ github.sha }} -- 'CHANGELOG.md' 'docs/preview-changelog.md' | head -1)

            if [ -z "$CHANGELOG_CHANGED" ]; then
              echo "::error::Source code changed but CHANGELOG.md was not updated."
              echo "::error::Please add an entry to the [Unreleased] section of CHANGELOG.md"
              echo "::error::(or, for a preview-gated feature, to docs/preview-changelog.md)."
              echo "::error::If this change doesn't need a changelog entry (refactoring, tests, etc.),"
              echo "::error::add [skip changelog] to your commit message."
              exit 1
            else
              echo "Changelog was updated. Check passed."
            fi
          else
            echo "No source code changes detected. Skipping changelog check."
          fi

  # Cross-version compatibility gate: compiles, unit-tests, and platform-tests against
  # the full supported platform range — the sinceBuild=251 floor (2025.1), the previous
  # release (2025.2), and the newest supported platform (2026.2, build 262) — separately
  # from the release `build` job (which only builds/publishes on the default
  # platformVersion). Platform
  # releases have broken plugin-visible behavior without any binary-incompatible signature
  # change (jj-idea-qfgl / GitHub #55), so this only catches compile- and test-time
  # breaks; it does not replace a manual runIde smoke test against a new platform version.
  compat:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [ '2025.1', '2025.2', '2026.2' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compile and unit test against ${{ matrix.platform }}
        run: ./gradlew compileKotlin test -PplatformVersion=${{ matrix.platform }}

      # platformTest runs IntelliJ's LeakHunter at global teardown, which is prone to a
      # GC-timing false positive (retained-Project report that doesn't reproduce locally or
      # on a rerun of the same commit). Retry a few times before failing the build.
      - name: Platform tests against ${{ matrix.platform }} (retry flaky LeakHunter leak detection)
        run: |
          for attempt in 1 2 3; do
            echo "platformTest attempt $attempt"
            if ./gradlew platformTest --rerun -PplatformVersion=${{ matrix.platform }}; then exit 0; fi
            echo "::warning::platformTest attempt $attempt failed (likely flaky LeakHunter); retrying"
          done
          exit 1

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.platform }}
          path: build/reports/tests/
          retention-days: 14

  verify:
    # Runs the IntelliJ Plugin Verifier CLI against every IDE listed in the
    # pluginVerification block (build.gradle.kts), including the sinceBuild floor. Only
    # failureLevel-listed problem categories (compatibility, missing dependencies, invalid
    # plugin) fail this job — internal/experimental API usage is deliberately excluded, see
    # the comment on that block.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Plugin Verifier IDEs
        uses: actions/cache@v4
        with:
          path: ~/.pluginVerifier/ides
          key: plugin-verifier-ides-${{ hashFiles('build.gradle.kts') }}

      - name: Verify plugin
        run: ./gradlew verifyPlugin

      - name: Upload verifier reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier/
          retention-days: 14

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for version calculation

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Calculate version
        id: version
        run: |
          if [[ -n "${{ inputs.bump }}" ]]; then
            # Manual release via workflow_dispatch - calculate next version
            # Get latest version tag
            LATEST_TAG=$(git tag -l 'v*' | sort -V | tail -1)
            if [[ -z "$LATEST_TAG" ]]; then
              LATEST_TAG="v0.0.0"
            fi
            # Parse version components
            LATEST_VERSION=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"

            # Bump based on input
            case "${{ inputs.bump }}" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac

            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            IS_RELEASE=true
            echo "Bumping from ${LATEST_VERSION} to ${VERSION} (${{ inputs.bump }})"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Tagged release: use tag version (e.g., v0.2.0 -> 0.2.0)
            VERSION=${GITHUB_REF#refs/tags/v}
            IS_RELEASE=true
          else
            # Development build: use snapshot version based on latest tag
            LATEST_TAG=$(git tag -l 'v*' | sort -V | tail -1)
            LATEST_VERSION=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
            VERSION="${MAJOR}.${MINOR}.${{ github.run_number }}-SNAPSHOT"
            IS_RELEASE=false
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "is_release=${IS_RELEASE}" >> $GITHUB_OUTPUT
          echo "Calculated version: ${VERSION} (release: ${IS_RELEASE})"

      - name: Update version in build.gradle.kts
        run: |
          sed -i 's/^version = .*/version = "${{ steps.version.outputs.version }}"/' build.gradle.kts
          cat build.gradle.kts | grep '^version'

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Lint
        run: ./gradlew ktlintCheck

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-artifact
          path: build/distributions/*.zip
          retention-days: 30

      - name: Extract changelog for release
        if: steps.version.outputs.is_release == 'true'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # For workflow_dispatch, use [Unreleased] section since CHANGELOG.md
          # hasn't been updated yet with a versioned section
          if [[ -n "${{ inputs.bump }}" ]]; then
            TARGET_SECTION="Unreleased"
          else
            TARGET_SECTION="$VERSION"
          fi

          # Extract section between ## [TARGET] and next ## [ or link reference
          NOTES=$(awk -v target="$TARGET_SECTION" '
            $0 ~ "^## \\[" target "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[.+\]:/ { exit }
            found { print }
          ' CHANGELOG.md)

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Create release (from tag push or workflow_dispatch)
      - name: Create GitHub Release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.notes }}
          files: build/distributions/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CHANGELOG.md for workflow_dispatch release
        if: steps.version.outputs.is_release == 'true' && inputs.bump != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DATE=$(date +%Y-%m-%d)

          # Move [Unreleased] content to new version section
          awk -v version="$VERSION" -v date="$DATE" '
            BEGIN { in_unreleased = 0 }

            /^## \[Unreleased\]/ {
              print $0
              print ""
              print "## [" version "] - " date
              in_unreleased = 1
              next
            }

            in_unreleased && /^## \[/ {
              in_unreleased = 0
              print $0
              next
            }

            /^\[Unreleased\]:/ {
              print "[Unreleased]: https://github.com/kkkev/jj-idea/compare/v" version "...HEAD"
              next
            }

            { print }
          ' CHANGELOG.md > CHANGELOG.md.tmp && mv CHANGELOG.md.tmp CHANGELOG.md

          # Add link for new version after [Unreleased]: line
          if ! grep -q "^\[$VERSION\]:" CHANGELOG.md; then
            awk -v version="$VERSION" '
              /^\[Unreleased\]:/ {
                print
                print "[" version "]: https://github.com/kkkev/jj-idea/releases/tag/v" version
                next
              }
              { print }
            ' CHANGELOG.md > CHANGELOG.md.tmp && mv CHANGELOG.md.tmp CHANGELOG.md
          fi

      - name: Update plugin repository XML
        if: steps.version.outputs.is_release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
          CHANGE_NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          PLUGIN_FILE="jj-idea-${VERSION}.zip"

          # Convert markdown to basic HTML (safely via env var)
          CHANGE_NOTES_HTML=$(echo "$CHANGE_NOTES" | sed 's/^### \(.*\)$/<h4>\1<\/h4>/g' | sed 's/^- \(.*\)$/<li>\1<\/li>/g' | sed 's/^$//g')

          cat > updatePlugins.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plugins>
            <plugin id="in.kkkev.jj-idea" url="https://github.com/kkkev/jj-idea/releases/download/${TAG_NAME}/${PLUGIN_FILE}" version="${VERSION}">
              <idea-version since-build="251.0" />
              <name>Jujutsu VCS Integration</name>
              <description><![CDATA[
                <p>Native IntelliJ integration for <a href="https://jj-vcs.github.io/jj/">Jujutsu (jj)</a>, a Git-compatible version control system with a fundamentally different approach to working with code.</p>

                <h3>Why Jujutsu?</h3>
                <p>Jujutsu treats your working copy as a commit—always. No staging area, no "dirty" state. Just describe what you're working on and keep coding.</p>

                <h3>Key Features</h3>
                <ul>
                    <li><b>Describe-First Workflow</b> — Working Copy tool window for describing current work and creating new changes.</li>
                    <li><b>Custom Log View</b> — Visual commit graph with inline change IDs, descriptions, and bookmarks.</li>
                    <li><b>Change Operations</b> — Edit, abandon, and describe changes directly from the log.</li>
                    <li><b>File History &amp; Annotations</b> — Full file history with diff viewer and line-by-line blame.</li>
                    <li><b>Multi-Repository Support</b> — Work with multiple JJ repositories in a single project.</li>
                    <li><b>Real-Time Status</b> — Auto-refresh keeps the UI in sync as you edit files.</li>
                </ul>

                <p><a href="https://github.com/kkkev/jj-idea">GitHub</a> · <a href="https://github.com/kkkev/jj-idea/issues">Issues</a></p>
              ]]></description>
              <vendor email="jj-idea@kkkev.in" url="https://github.com/kkkev/jj-idea">Kevin Thomas</vendor>
              <change-notes><![CDATA[
                <h3>${VERSION}</h3>
                ${CHANGE_NOTES_HTML}
                <p>See <a href="https://github.com/kkkev/jj-idea/releases/tag/${TAG_NAME}">full release notes</a> for details.</p>
              ]]></change-notes>
            </plugin>
          </plugins>
          EOF

      - name: Commit updated plugin repository XML
        if: steps.version.outputs.is_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updatePlugins.xml CHANGELOG.md
          git commit -m "Update plugin repository for release ${{ steps.version.outputs.tag }}" || echo "No changes to commit"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      # Publish to JetBrains Marketplace on releases
      # Requires PUBLISH_TOKEN secret from JetBrains Hub (hub.jetbrains.com → Profile → Tokens)
      # Optional: CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD for plugin signing
      - name: Publish to JetBrains Marketplace
        if: steps.version.outputs.is_release == 'true' && env.PUBLISH_TOKEN != ''
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      # publishPlugin succeeding only means the upload was accepted — Marketplace then runs its
      # own automated compatibility check (its own plugin-verifier run against its full IDE
      # matrix) asynchronously, which can reject the upload for reasons our verifyPlugin task
      # doesn't check for (e.g. OVERRIDE_ONLY_API_USAGES wasn't in our failureLevel until this was
      # added). 0.8.11 was rejected this way and nobody noticed until the next release attempt,
      # because a successful publishPlugin looks identical in the Actions log either way. Poll the
      # public Marketplace API and fail the job if the just-released version hasn't shown up as
      # listed+approved within a generous window, so a rejection is visible in this run instead of
      # discovered "yet again" later. 30576 is this plugin's numeric Marketplace ID (see
      # https://plugins.jetbrains.com/plugin/30576), distinct from its xmlId (in.kkkev.jj-idea).
      - name: Verify JetBrains Marketplace approval
        if: steps.version.outputs.is_release == 'true' && env.PUBLISH_TOKEN != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          MAX_ATTEMPTS=25
          SLEEP_SECONDS=120
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Checking Marketplace listing for $VERSION (attempt $attempt/$MAX_ATTEMPTS)..."
            # Response is a bare JSON array of version objects; the approval field is "approve",
            # not "approved". Write to a file rather than capturing in a shell variable — command
            # substitution has been observed to mangle the payload (the changelog notes embedded
            # in each entry are large HTML blobs).
            if curl -sf "https://plugins.jetbrains.com/api/plugins/30576/updates?page=1&size=5" -o /tmp/marketplace-updates.json; then
              MATCH=$(jq -r --arg v "$VERSION" \
                '.[]? | select(.version == $v and .approve == true and .listed == true) | .version' \
                /tmp/marketplace-updates.json)
              if [[ "$MATCH" == "$VERSION" ]]; then
                echo "$VERSION is listed and approved on JetBrains Marketplace."
                exit 0
              fi
            fi
            sleep "$SLEEP_SECONDS"
          done
          echo "::error::$VERSION was not listed/approved on JetBrains Marketplace after $((MAX_ATTEMPTS * SLEEP_SECONDS / 60)) minutes."
          echo "::error::The upload succeeded but Marketplace's own compatibility check may have rejected it (as happened with 0.8.11)."
          echo "::error::Check https://plugins.jetbrains.com/plugin/30576 and the JetBrains Hub developer dashboard/email for the specific violation."
          exit 1
